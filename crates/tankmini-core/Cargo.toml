[package]
name = "tankmini-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reverse-engineered USB-MIDI protocol for the M-VAVE TANK MINI pedal"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10.1", default-features = false, features = ["tls", "json"], optional = true }

[features]
# The M-VAVE community client (network). Off for the CLI, on for the GUI.
community = ["dep:ureq"]
