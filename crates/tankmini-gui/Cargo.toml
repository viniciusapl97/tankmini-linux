[package]
name = "tankmini-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 desktop control app for the M-VAVE TANK MINI pedal"

[[bin]]
name = "tankmini-gui"
path = "src/main.rs"

[dependencies]
tankmini-core = { path = "../tankmini-core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
