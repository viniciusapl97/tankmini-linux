[package]
name = "tankmini-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 desktop control app for the M-VAVE TANK MINI pedal"

[[bin]]
name = "tankmini-gui"
path = "src/main.rs"

[dependencies]
tankmini-core = { path = "../tankmini-core", features = ["community"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
async-channel = "2"
serde_json = "1"
pangocairo = "0.21"
